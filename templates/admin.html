<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PupQroo - Administración</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-green: #2d6a4f; --secondary-green: #52b788; --light-bg: #f8f9fa; }
        body { background-color: var(--light-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--primary-green); color: white; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar .brand-container { padding: 1.5rem; text-align: center; }
        .sidebar .logo-img { max-height: 45px; width: auto; }
        .sidebar .nav-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar .nav-link { color: rgba(255, 255, 255, 0.8); padding: 1rem 1.5rem; display: block; text-decoration: none; font-weight: 500; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: rgba(255, 255, 255, 0.15); color: white; border-left: 4px solid #d8f3dc; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; }
        .topbar { background: white; border-bottom: 1px solid #dee2e6; padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .content-body { padding: 2rem; flex-grow: 1; }
        .card-custom { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.04); border-radius: 12px; }
        .btn-custom { background-color: var(--primary-green); color: white; }
        .btn-custom:hover { background-color: #1b4332; color: white; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <div class="sidebar">
            <div class="brand-container">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-img" onerror="this.style.display='none'">
                <h4 class="fw-bold mt-2">PupQroo</h4>
            </div>
            <ul class="nav-menu mt-3">
                <li class="nav-item"><a href="#" class="nav-link active" id="navCitas" onclick="cambiarSeccion('citas')">📋 Citas</a></li>
                <li class="nav-item"><a href="#" class="nav-link" id="navPacientes" onclick="cambiarSeccion('pacientes')">🐾 Pacientes</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="topbar">
                <div class="text-muted small" id="breadcrumb">Inicio / Citas</div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-light text-dark p-2 border">🩺 Dr. Veterinario (Admin)</span>
                    <a href="/" class="btn btn-sm btn-outline-success">👤 Ir a Tutor</a>
                </div>
            </div>
            <div class="content-body" id="adminContainer"></div>
        </div>
    </div>

    <!-- Modal Registrar Mascota -->
    <div class="modal fade" id="modalAgregarMascota" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0"><h5 class="fw-bold text-success">Agregar Mascota</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="formNuevaMascota" onsubmit="guardarMascota(event)">
                        <div class="mb-3"><label class="form-label small text-muted">Nombre</label><input type="text" class="form-control" id="mNombre" required></div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label small text-muted">Especie</label><select class="form-select" id="mEspecie"><option value="Perro">Perro</option><option value="Gato">Gato</option></select></div>
                            <div class="col-md-6 mb-3"><label class="form-label small text-muted">Raza</label><input type="text" class="form-control" id="mRaza" required></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label small text-muted">Edad (años)</label><input type="number" class="form-control" id="mEdad" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label small text-muted">Peso (kg)</label><input type="number" step="0.1" class="form-control" id="mPeso" required></div>
                        </div>
                        <div class="mb-3"><label class="form-label small text-muted">Tutor</label><input type="text" class="form-control" id="mTutor" required></div>
                        <button type="submit" class="btn btn-custom w-100 py-2 fw-bold">Guardar Mascota</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => cambiarSeccion('citas'));

        function cambiarSeccion(sech) {
            document.querySelectorAll('.sidebar .nav-link').forEach(l => l.classList.remove('active'));
            const c = document.getElementById('adminContainer'), b = document.getElementById('breadcrumb');

            if (sech === 'citas') {
                document.getElementById('navCitas').classList.add('active'); b.innerText = "Inicio / Citas";
                c.innerHTML = `
                    <div class="mb-4"><h2 class="text-success fw-bold">Agenda de citas</h2><p class="text-muted small">Gestiona las consultas.</p></div>
                    <div class="card card-custom p-4 bg-white"><table class="table align-middle"><thead class="table-light"><tr><th>Fecha</th><th>Paciente</th><th>Tutor</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tablaCitas"><tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr></tbody></table></div>`;
                cargarCitasAdmin();
            } else if (sech === 'pacientes') {
                document.getElementById('navPacientes').classList.add('active'); b.innerText = "Inicio / Pacientes";
                c.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="text-success fw-bold">Pacientes</h2><p class="text-muted small">Directorio clínico.</p></div><button class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#modalAgregarMascota">+ Agregar mascota</button></div>
                    <div class="row g-4" id="gridPacientes"><div class="col-12 text-center text-muted">Cargando...</div></div>`;
                cargarPacientesAdmin();
            }
        }

        async function cargarCitasAdmin() {
            const res = await fetch('/api/citas'); const json = await res.json();
            const tb = document.getElementById('tablaCitas'); tb.innerHTML = '';
            if(json.success && json.data.length) {
                json.data.forEach(x => {
                    tb.innerHTML += `<tr><td>${new Date(x.fechaInicio).toLocaleString()}</td><td class="fw-bold">${x.mascotaNombre}</td><td>${x.tutorNombre}</td><td>${x.motivo}</td><td><span class="badge bg-success">${x.estado}</span></td><td><button class="btn btn-sm btn-success me-1" onclick="cambiarEstado('${x._id}', 'confirmada')">Confirmar</button></td></tr>`;
                });
            } else { tb.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Sin citas.</td></tr>'; }
        }

        async function cambiarEstado(id, estado) {
            await fetch(`/api/citas/${id}/estado`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({estado}) });
            cargarCitasAdmin();
        }

        async function cargarPacientesAdmin() {
            const res = await fetch('/api/mascotas'); const json = await res.json();
            const g = document.getElementById('gridPacientes'); g.innerHTML = '';
            if(json.success && json.data.length) {
                json.data.forEach(x => {
                    g.innerHTML += `<div class="col-md-4"><div class="card card-custom p-4 bg-white h-100"><h5 class="fw-bold">${x.nombre}</h5><p class="text-muted small">${x.especie} • ${x.raza}</p><div class="border-top pt-2 small">Tutor: <strong>${x.tutorNombre || 'N/A'}</strong></div></div></div>`;
                });
            } else { g.innerHTML = '<div class="col-12 text-center text-muted">Sin pacientes.</div>'; }
        }

        async function guardarMascota(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('mNombre').value, especie: document.getElementById('mEspecie').value,
                raza: document.getElementById('mRaza').value, edad: document.getElementById('mEdad').value,
                pesoKg: document.getElementById('mPeso').value, tutorNombre: document.getElementById('mTutor').value
            };
            const res = await fetch('/api/mascotas', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if((await res.json()).success) {
                alert("¡Mascota guardada!"); bootstrap.Modal.getInstance(document.getElementById('modalAgregarMascota')).hide();
                e.target.reset(); cargarPacientesAdmin();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
